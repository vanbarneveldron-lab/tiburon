translations.ca.nextRef='La pròxima referència disponible serà: {value}'; translations.es.nextRef='La próxima referencia disponible será: {value}'; translations.en.nextRef='The next available reference will be: {value}';
function getLanguage() {
  const language = appData && appData.language
    ? String(appData.language).toLowerCase()
    : 'ca';

  return translations[language] ? language : 'ca';
}

function applyTranslations() {
  const language = getLanguage();
  const dictionary = translations[language];

  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.dataset.i18n;

    if (dictionary[key] !== undefined) {
      element.textContent = dictionary[key];
    }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
    const key = element.dataset.i18nPlaceholder;
    if (dictionary[key] !== undefined) element.placeholder = dictionary[key];
  });
  const lookupButton = document.getElementById('lookup_isbn_button');
  if (lookupButton) lookupButton.textContent = dictionary.lookupButton;
}

function translateMessage(message) {
  const language = getLanguage();
  const dictionary = translations[language] || translations.ca;

  if (dictionary[message]) return dictionary[message];
  if (dictionary['error_' + message]) return dictionary['error_' + message];
  const text = String(message || '');
  const noBook = { 'Dit ISBN is ongeldig. Controleer het nummer.':'isbnInvalid', 'Geen boek gevonden voor dit ISBN.':'isbnNotFound', 'Er ging iets mis bij het opzoeken.':'isbnError' }[text];
  if (noBook) return dictionary[noBook];
  const http = text.match(/^Open Library geeft HTTP-fout (\d+)\. Probeer het later opnieuw\.$/);
  if (http) return {ca:'Open Library ha retornat l’error HTTP {n}. Torneu-ho a provar més tard.',es:'Open Library devolvió el error HTTP {n}. Inténtalo de nuevo más tarde.',en:'Open Library returned HTTP error {n}. Please try again later.'}[language].replace('{n}',http[1]);
  const next = text.match(/^La pròxima referència disponible serà: (.+)$/);
  if (next) return dictionary.nextRef.replace('{value}',next[1]);
  return message;
}

function showPage(page) {
  if (page === 'new-item') document.getElementById('sell-item-button').classList.add('hidden');
  document.querySelectorAll('.page').forEach(el => {
    el.classList.add('hidden');
  });

  document.getElementById(page + '-page').classList.remove('hidden');

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  document.getElementById('page-title').textContent = pageNames[page];
  document.getElementById('breadcrumb-page').textContent = pageNames[page];

  if (page === 'inventory') renderInventory();
  if (page === 'sales') renderSalesHistory();
  if (page === 'publications') { renderPublications(); renderPublicationOptions(); }
  if (page === 'reports') renderVatReport();
  if (page === 'new-item') prepareNewItem();
}

function loadData(onLoaded) {
  google.script.run
    .withSuccessHandler(data => {
      appData = data;
      applyTranslations();
      renderDashboard();
      renderInventory();
      renderItemTypes();
      renderSalesHistory();
      renderPublications();
      renderPublicationOptions();
      renderVatReport();
      updateReferenceWarning();

      if (typeof onLoaded === 'function') {
        onLoaded();
      }
    })
    .withFailureHandler(showError)
    .getInitialData();
}

function renderDashboard() {
  const activeItems = appData.items.filter(item =>
    String(item.status).toLowerCase() === 'active'
  );

  const inventoryValue = activeItems.reduce((sum, item) => {
    return sum + (Number(item.asking_price) || 0);
  }, 0);

  document.getElementById('stat-items').textContent =
    activeItems.length.toLocaleString('ca-ES');

  document.getElementById('stat-value').textContent =
    formatCurrency(inventoryValue);

  document.getElementById('stat-sales').textContent =
    appData.sales.filter(sale => String(sale.status).toLowerCase() === 'active').length.toLocaleString('ca-ES');

  document.getElementById('stat-types').textContent =
    appData.itemTypes.filter(type =>
      String(type.active).toUpperCase() !== 'FALSE'
    ).length.toLocaleString('ca-ES');

  const recent = [...activeItems]
    .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))
    .slice(0, 5);

  const container = document.getElementById('recent-items');

  if (!recent.length) {
    container.innerHTML =
      '<div class="empty-state">Encara no hi ha articles registrats.</div>';
    return;
  }

  container.innerHTML = createTable(recent);
}

function renderInventory() {
  const search = (
    document.getElementById('inventory-search')?.value || ''
  ).toLowerCase().trim();

  const selectedType =
    document.getElementById('inventory-type-filter')?.value || '';

  const filtered = appData.items
    .filter(item => String(item.status).toLowerCase() === 'active')
    .filter(item => !selectedType ||
      String(item.item_type_id) === selectedType
    )
    .filter(item => {
      const haystack = [
        item.reference_no,
        item.title,
        item.author,
        item.isbn
      ].join(' ').toLowerCase();

      return haystack.includes(search);
    })
    .sort((a, b) =>
      Number(b.reference_no) - Number(a.reference_no)
    );

  const container = document.getElementById('inventory-table');

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty-state">No s’han trobat articles.</div>';
    return;
  }

  container.innerHTML = createTable(filtered);
}

function createTable(items) {
  const dictionary = translations[getLanguage()];
  const rows = items.map(item => `
    <tr>
      <td class="reference">${escapeHtml(item.reference_no)}</td>
      <td>${escapeHtml(item.title)}</td>
      <td>${escapeHtml(item.author || '—')}</td>
      <td>${escapeHtml(item.isbn || '—')}</td>
      <td>${item.asking_price === '' || item.asking_price == null
        ? '—'
        : formatCurrency(item.asking_price)}</td>
      <td class="table-actions">
        <button class="small-button sale-button" data-item-id="${escapeHtml(item.item_id)}" data-i18n="sellItem">${escapeHtml(dictionary.sellItem)}</button>
        <button class="small-button edit-item-button" data-item-id="${escapeHtml(item.item_id)}" data-i18n="editItem">${escapeHtml(dictionary.editItem)}</button>
      </td>
    </tr>
  `).join('');

  return `
    <table class="data-table">
      <thead>
        <tr>
          <th>${escapeHtml(dictionary.reference)}</th>
          <th>${escapeHtml(dictionary.title)}</th>
          <th>${escapeHtml(dictionary.author)}</th>
          <th>${escapeHtml(dictionary.isbn)}</th>
          <th>${escapeHtml(dictionary.price)}</th>
          <th>${escapeHtml(dictionary.actions)}</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderItemTypes() {
  const language = getLanguage();
  const nameKey = 'name_' + language;
  const displayName = type =>
    String(type[nameKey] || type.name_ca || type.item_type_id || '');

  const activeTypes = appData.itemTypes
    .filter(type => String(type.active).toUpperCase() !== 'FALSE')
    .sort((a, b) => displayName(a).localeCompare(displayName(b), language));

  const itemSelect = document.getElementById('item_type_id');
  const filterSelect = document.getElementById('inventory-type-filter');

  const previousFilter = filterSelect.value;

  const dictionary = translations[language];
  itemSelect.innerHTML = '<option value="">' + dictionary.typePlaceholder + '</option>';
  filterSelect.innerHTML = '<option value="">' + dictionary.allTypes + '</option>';

  activeTypes.forEach(type => {
    const itemOption = document.createElement('option');
    itemOption.value = type.item_type_id;
    itemOption.textContent = displayName(type);
    itemSelect.appendChild(itemOption);

    const filterOption = document.createElement('option');
    filterOption.value = type.item_type_id;
    filterOption.textContent = displayName(type);
    filterSelect.appendChild(filterOption);
  });

  filterSelect.value = previousFilter;
}

function updateReferenceWarning() {
  const warning = document.getElementById('reference-warning');
  const saveButton = document.getElementById('save-button');

  const next = Number(appData.nextReference);
  const validReference = Number.isInteger(next) && next > 0;

  if (selectedItemId) {
    warning.textContent =
      'Estàs modificant un article existent. La referència no canviarà.';
    warning.classList.remove('hidden');
    saveButton.disabled = false;
    return;
  }

  if (!validReference) {
    warning.textContent =
      'Cal configurar NEXT_REFERENCE_NO al full Settings abans de crear articles.';
    warning.classList.remove('hidden');
    saveButton.disabled = true;
  } else {
    warning.textContent =
      'La pròxima referència disponible serà: ' + next;
    warning.classList.remove('hidden');
    saveButton.disabled = appData.itemTypes.length === 0;
  }
}

function prepareNewItem() {
  document.getElementById('item-form').reset();

  document.getElementById('form-heading').textContent =
    'Afegir un article';

  document.getElementById('form-description').textContent =
    'Introdueix les dades bàsiques de l’article.';

  document.getElementById('save-button').textContent =
    'Desar article';

  renderItemTypes();
  updateReferenceWarning();

  if (!appData.itemTypes.length) {
    const warning = document.getElementById('reference-warning');
    warning.textContent =
      translateMessage('Cal configurar primer els tipus d’article al full ItemTypes.');
    warning.classList.remove('hidden');
    document.getElementById('save-button').disabled = true;
  }
}

function submitItem(event) {
  event.preventDefault();
  if (!validatePrice()) {
    return;
  }

  const form = {
    item_type_id: document.getElementById('item_type_id').value,
    title: document.getElementById('title').value,
    author: document.getElementById('author').value,
    illustrator: document.getElementById('illustrator').value,
    collection: document.getElementById('collection').value,
    publisher: document.getElementById('publisher').value,
    publication_year: document.getElementById('publication_year').value,
    isbn: document.getElementById('isbn').value,
    cover_type: document.getElementById('cover_type').value,
    dimensions: document.getElementById('dimensions').value,
    pages: document.getElementById('pages').value,
    weight: document.getElementById('weight').value,
    edition: document.getElementById('edition').value,
    condition: document.getElementById('condition').value,
    asking_price: document.getElementById('asking_price').value
  };

  const isEditing = Boolean(selectedItemId);
  const button = document.getElementById('save-button');

  button.disabled = true;
  button.textContent = 'Desant...';

  const request = google.script.run
    .withSuccessHandler(result => {
      showMessage(
        (isEditing ? 'Article actualitzat. ' : 'Article creat. ') +
        'Referència: ' + result.reference_no,
        'success'
      );

      selectedItemId = null;
      button.disabled = false;
      button.textContent = 'Desar article';

      loadData(() => {
        showPage('inventory');
      });
    })
    .withFailureHandler(error => {
      button.disabled = false;
      button.textContent = isEditing ? 'Desar canvis' : 'Desar article';
      showError(error);
    });

  if (isEditing) {
    request.updateItem(selectedItemId, form);
  } else {
    request.saveItem(form);
  }
}

function formatCurrency(value) {
  return new Intl.NumberFormat('ca-ES', {
    style: 'currency',
    currency: 'EUR'
  }).format(Number(value) || 0);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function validatePrice() {
  const input = document.getElementById('asking_price');
  const error = document.getElementById('asking_price_error');

  const value = input.value.trim();

  // Een leeg bedrag is toegestaan.
  const valid = value === '' ||
    /^\d+([,.]\d{1,2})?$/.test(value);

  if (!valid) {
    input.classList.add('invalid');
    error.textContent =
      'Preu no vàlid. Introdueix un màxim de dos decimals (exemple: 12,50).';
    error.classList.remove('hidden');

    input.focus();
    return false;
  }

  input.classList.remove('invalid');
  error.classList.add('hidden');
  error.textContent = '';

  return true;
}

function clearPriceError() {
  const input = document.getElementById('asking_price');
  const error = document.getElementById('asking_price_error');

  input.classList.remove('invalid');
  error.classList.add('hidden');
  error.textContent = '';
}

function showError(error) {
  const message = error && error.message
    ? error.message
    : String(error);

  showMessage(translateMessage(message), 'error');
}

function showMessage(message, type) {
  const area = document.getElementById('message-area');
  area.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = translateMessage(message);
  area.appendChild(div);
}

function startNewItem() {
  selectedItemId = null;
  showPage('new-item');
}

function lookupIsbn() {
  const isbnInput = document.getElementById('isbn');
  const message = document.getElementById('isbn_lookup_message');
  const button = document.getElementById('lookup_isbn_button');

  const isbn = isbnInput.value.trim();

  const dictionary = translations[getLanguage()];
  message.classList.add('hidden');
  message.textContent = '';

  if (!isbn) {
    message.textContent = dictionary.isbnRequired;
    message.classList.remove('hidden');
    return;
  }

  button.disabled = true;
  button.textContent = dictionary.isbnSearching;

  google.script.run
    .withSuccessHandler(result => {
      button.disabled = false;
      button.textContent = dictionary.lookupButton;

      if (!result.found) {
        message.textContent = translateMessage(result.message);
        message.classList.remove('hidden');
        return;
      }

      // Vul alleen lege velden in.
      // Handmatig ingevoerde waarden blijven behouden.
      fillMetadataField('title', result.title);
      fillMetadataField('author', result.author);
      fillMetadataField('publisher', result.publisher);
      fillMetadataField('publication_year', result.publication_year);
      fillMetadataField('pages', result.pages);
      fillMetadataField('dimensions', result.dimensions);

      message.textContent = dictionary.isbnFound.replace('{source}', result.source);
      message.classList.remove('hidden');
    })
    .withFailureHandler(error => {
      button.disabled = false;
      button.textContent = dictionary.lookupButton;

      message.textContent = translateMessage(
        error.message || 'Er ging iets mis bij het opzoeken.'
      );
      message.classList.remove('hidden');
    })
    .lookupBookByIsbn(isbn);
}

function fillMetadataField(fieldId, value) {
  const field = document.getElementById(fieldId);

  if (field && value !== '' && !field.value.trim()) {
    field.value = value;
  }
}

function editItem(itemId) {
  const item = appData.items.find(record =>
    String(record.item_id) === String(itemId)
  );

  if (!item) {
    showError('No s’ha trobat l’article.');
    return;
  }

  selectedItemId = itemId;
  showPage('new-item');
    const sellButton = document.getElementById('sell-item-button');
    sellButton.textContent = translations[getLanguage()].sellItem;
    if (String(item.status || '').toLowerCase() === 'active') sellButton.classList.remove('hidden');

  const fields = [
    'item_type_id',
    'title',
    'author',
    'illustrator',
    'collection',
    'publisher',
    'publication_year',
    'isbn',
    'cover_type',
    'dimensions',
    'pages',
    'weight',
    'edition',
    'condition',
    'asking_price'
  ];

  fields.forEach(field => {
    document.getElementById(field).value =
      item[field] == null ? '' : item[field];
  });

  document.getElementById('form-heading').textContent =
    'Modificar article';

  document.getElementById('form-description').textContent =
    'Actualitza les dades de l’article.';

  document.getElementById('save-button').textContent =
    'Desar canvis';

  updateReferenceWarning();
}

function localToday() {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function startSale(itemId) {
  const item = appData.items.find(record => String(record.item_id) === String(itemId) && String(record.status).toLowerCase() === 'active');
  if (!item) { showError({ message: 'ITEM_NOT_ACTIVE' }); return; }
  const dictionary = translations[getLanguage()];
  document.getElementById('sale-item-id').value = item.item_id;
  document.getElementById('sale-date').value = localToday();
  document.getElementById('sale-gross-price').value = item.asking_price === '' || item.asking_price == null ? '' : item.asking_price;
  document.getElementById('sale-vat-rate').value = '4';
  populateSaleChannels(item.item_id);
  document.getElementById('sale-item-summary').textContent = dictionary.saleItem + ' ' + item.reference_no + ' — ' + item.title;
  showPage('sales');
  document.getElementById('sale-form-container').classList.remove('hidden');
  document.getElementById('sale-date').focus();
}
function populateSaleChannels(itemId) {
  const dictionary = translations[getLanguage()];
  const channel = document.getElementById('sale-channel-type');
  const otherField = document.getElementById('sale-other-channel-field');
  const otherInput = document.getElementById('sale-other-channel');
  const activePublicationIds = new Set((appData.publications || []).filter(pub =>
    String(pub.item_id) === String(itemId) && String(pub.status).toLowerCase() === 'active'
  ).map(pub => String(pub.platform_id)));
  const seenPlatformIds = new Set();
  const activePlatforms = appData.platforms.filter(platform => {
    const id = String(platform.platform_id);
    if (String(platform.active).toUpperCase() === 'FALSE' || !activePublicationIds.has(id) || seenPlatformIds.has(id)) return false;
    seenPlatformIds.add(id);
    return true;
  });
  channel.innerHTML = '<option value="">' + escapeHtml(dictionary.salesChannel) + '</option>' +
    activePlatforms.map(platform => '<option value="platform:' + escapeHtml(platform.platform_id) + '">' + escapeHtml(platform.name) + '</option>').join('') +
    '<option value="other">' + escapeHtml(dictionary.otherSaleChannelOption) + '</option>';
  otherField.classList.add('hidden');
  otherInput.required = false;
  otherInput.value = '';
}
function updateSaleChannelFields() {
  const isOther = document.getElementById('sale-channel-type').value === 'other';
  const field = document.getElementById('sale-other-channel-field');
  const input = document.getElementById('sale-other-channel');
  field.classList.toggle('hidden', !isOther);
  input.required = isOther;
}
function cancelSale() {
  document.getElementById('sale-form').reset();
  document.getElementById('sale-form-container').classList.add('hidden');
}
function submitSale(event) {
  event.preventDefault();
  const form = {
    item_id: document.getElementById('sale-item-id').value,
    sale_date: document.getElementById('sale-date').value,
    gross_price: document.getElementById('sale-gross-price').value.trim(),
    vat_rate: document.getElementById('sale-vat-rate').value.trim(),
    sales_channel_type: document.getElementById('sale-channel-type').value === 'other' ? 'other' : 'platform',
    sales_channel: document.getElementById('sale-channel-type').value === 'other'
      ? document.getElementById('sale-other-channel').value.trim()
      : document.getElementById('sale-channel-type').value.replace(/^platform:/, '')
  };
  const submitButton = document.getElementById('save-sale-button');
  submitButton.disabled = true;
  google.script.run.withSuccessHandler(() => {
    submitButton.disabled = false;
    document.getElementById('sale-form').reset();
    document.getElementById('sale-form-container').classList.add('hidden');
    loadData(() => {
      showPage('sales');
      showMessage(translations[getLanguage()].saleSaved, 'success');
    });
  }).withFailureHandler(error => {
    submitButton.disabled = false;
    showError(error);
  }).saveSale(form);
}
function reverseSaleFromHistory(saleId) {
  const dictionary = translations[getLanguage()];
  if (!window.confirm(dictionary.reverseConfirm)) return;
  google.script.run.withSuccessHandler(() => {
    loadData(() => {
      showPage('sales');
      showMessage(translations[getLanguage()].saleReversed, 'success');
    });
  }).withFailureHandler(showError).reverseSale(saleId);
}
function formatSaleDate(value) {
  const parts = String(value || '').slice(0, 10).split('-').map(Number);
  if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return escapeHtml(value || '—');
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  const locale = { ca: 'ca-ES', es: 'es-ES', en: 'en-GB' }[getLanguage()];
  return new Intl.DateTimeFormat(locale).format(date);
}
function renderSalesHistory() {
  const container = document.getElementById('sales-history-table');
  if (!container) return;
  const dictionary = translations[getLanguage()];
  const sales = [...appData.sales].sort((a, b) =>
    String(b.sale_date || '').localeCompare(String(a.sale_date || '')) ||
    String(b.sale_id || '').localeCompare(String(a.sale_id || ''))
  );
  if (!sales.length) {
    container.innerHTML = '<div class="empty-state">' + escapeHtml(dictionary.salesEmpty) + '</div>';
    return;
  }
  const locale = { ca: 'ca-ES', es: 'es-ES', en: 'en-GB' }[getLanguage()];
  const rows = sales.map(sale => {
    const reversed = String(sale.status).toLowerCase() !== 'active';
    const item = appData.items.find(record => String(record.item_id) === String(sale.item_id));
    const title = item ? item.title : '';
    const vatRate = Number(sale.vat_rate) || 0;
    const action = reversed ? '—' :
      '<button class="small-button reverse-sale-button" data-sale-id="' + escapeHtml(sale.sale_id) + '">' +
      escapeHtml(dictionary.reverseSale) + '</button>';
    return '<tr class="' + (reversed ? 'sale-reversed' : '') + '">' +
      '<td class="reference">' + escapeHtml(sale.reference_no) + '</td>' +
      '<td>' + escapeHtml(title) + '</td>' +
      '<td>' + formatSaleDate(sale.sale_date) + '</td>' +
      '<td>' + formatCurrency(sale.gross_price) + '</td>' +
      '<td>' + vatRate.toLocaleString(locale) + '%</td>' +
      '<td>' + formatCurrency(sale.vat_amount) + '</td>' +
      '<td>' + formatCurrency(sale.net_amount) + '</td>' +
      '<td>' + escapeHtml(sale.sales_channel || '—') + '</td>' +
      '<td>' + escapeHtml(reversed ? dictionary.reversedSale : dictionary.activeSale) + '</td>' +
      '<td>' + action + '</td></tr>';
  }).join('');
  container.innerHTML = '<div class="table-scroll"><table class="data-table sales-table">' +
    '<thead><tr><th>' + escapeHtml(dictionary.reference) + '</th>' +
    '<th>' + escapeHtml(dictionary.title) + '</th>' +
    '<th>' + escapeHtml(dictionary.saleDateHeader) + '</th>' +
    '<th>' + escapeHtml(dictionary.grossHeader) + '</th>' +
    '<th>' + escapeHtml(dictionary.vatHeader) + ' %</th>' +
    '<th>' + escapeHtml(dictionary.vatHeader) + '</th>' +
    '<th>' + escapeHtml(dictionary.netHeader) + '</th>' +
    '<th>' + escapeHtml(dictionary.saleChannelHeader) + '</th>' +
    '<th>' + escapeHtml(dictionary.status) + '</th>' +
    '<th>' + escapeHtml(dictionary.actions) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function renderPublicationOptions() {
  const itemSelect = document.getElementById('publication-item');
  const platformSelect = document.getElementById('publication-platform');
  if (!itemSelect || !platformSelect) return;
  const activeItems = appData.items.filter(item => String(item.status).toLowerCase() === 'active');
  itemSelect.innerHTML = '<option value="">Seleccioneu un article</option>' + activeItems.map(item => '<option value="' + escapeHtml(item.item_id) + '">' + escapeHtml(item.reference_no + ' — ' + item.title) + '</option>').join('');
  const platforms = appData.platforms.filter(row => String(row.active).toUpperCase() !== 'FALSE');
  platformSelect.innerHTML = platforms.map(row => '<option value="' + escapeHtml(row.platform_id) + '">' + escapeHtml(row.name) + '</option>').join('');
}
function renderPublications() {
  const container = document.getElementById('publications-table');
  if (!container) return;
  const entries = [...(appData.publications || [])].sort((a, b) => String(b.listed_at).localeCompare(String(a.listed_at)));
  if (!entries.length) { container.innerHTML = '<div class="empty-state">Encara no hi ha publicacions registrades.</div>'; return; }
  const rows = entries.map(pub => {
    const item = appData.items.find(row => String(row.item_id) === String(pub.item_id));
    const platform = appData.platforms.find(row => String(row.platform_id) === String(pub.platform_id));
    const status = String(pub.status).toLowerCase();
    const active = status === 'active';
    const removalNeeded = status === 'remove_needed';
    const action = active || removalNeeded ? '<button class="small-button withdraw-publication" data-publication-id="' + escapeHtml(pub.publication_id) + '" data-removal-needed="' + removalNeeded + '">' + (removalNeeded ? escapeHtml(translations[getLanguage()].confirmRemoval) : 'Retira') + '</button>' : '—';
    const statusLabel = removalNeeded ? translations[getLanguage()].removeNeeded : (active ? 'Activa' : 'Retirada');
    return '<tr><td>' + escapeHtml(item ? item.reference_no : '—') + '</td><td>' + escapeHtml(item ? item.title : '—') + '</td><td>' + escapeHtml(platform ? platform.name : '—') + '</td><td>' + formatSaleDate(pub.listed_at) + '</td><td>' + (pub.withdrawn_at ? formatSaleDate(pub.withdrawn_at) : '—') + '</td><td>' + escapeHtml(statusLabel) + '</td><td>' + action + '</td></tr>';
  }).join('');
  container.innerHTML = '<div class="table-scroll"><table class="data-table"><thead><tr><th>Ref.</th><th>Article</th><th>Plataforma</th><th>Publicada</th><th>Retirada</th><th>Estat</th><th>Acció</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function renderVatReport() {
  const container = document.getElementById('vat-report');
  if (!container) return;
  const from = document.getElementById('report-from')?.value || '';
  const to = document.getElementById('report-to')?.value || '';
  const matching = appData.sales.filter(sale => { const date = String(sale.sale_date || '').slice(0, 10); return String(sale.status).toLowerCase() === 'active' && (!from || date >= from) && (!to || date <= to); });
  const totals = matching.reduce((sum, sale) => ({ gross: sum.gross + (Number(sale.gross_price) || 0), vat: sum.vat + (Number(sale.vat_amount) || 0), net: sum.net + (Number(sale.net_amount) || 0) }), { gross: 0, vat: 0, net: 0 });
  container.innerHTML = '<div class="stats-grid report-totals"><div class="stat-card"><div class="stat-label">Vendes</div><div class="stat-value">' + matching.length + '</div></div><div class="stat-card"><div class="stat-label">Total brut</div><div class="stat-value">' + formatCurrency(totals.gross) + '</div></div><div class="stat-card"><div class="stat-label">IVA</div><div class="stat-value">' + formatCurrency(totals.vat) + '</div></div><div class="stat-card"><div class="stat-label">Base imposable</div><div class="stat-value">' + formatCurrency(totals.net) + '</div></div></div>' + (matching.length ? '<p>' + matching.length + ' vendes incloses en el període.</p>' : '<div class="empty-state">No hi ha vendes en aquest període.</div>');
}
function submitPublication(event) {
  event.preventDefault();
  const button = document.getElementById('save-publication-button');
  const platformIds = Array.from(document.getElementById('publication-platform').selectedOptions)
    .map(option => option.value);
  button.disabled = true;
  google.script.run
    .withSuccessHandler(() => {
      button.disabled = false;
      document.getElementById('publication-form').reset();
      loadData(() => showPage('publications'));
    })
    .withFailureHandler(error => {
      button.disabled = false;
      showError(error);
    })
    .recordPublication({
      item_id: document.getElementById('publication-item').value,
      platform_ids: platformIds,
      listed_at: document.getElementById('publication-date').value
    });
}
function withdrawPublicationFromTable(id) {
  const status = eventStatusForPublication(id);
  if (!window.confirm(status ? translations[getLanguage()].confirmRemoval : translations[getLanguage()].withdrawConfirm)) return;
  google.script.run.withSuccessHandler(() => loadData(() => showPage('publications'))).withFailureHandler(showError).withdrawPublication(id);
}
function eventStatusForPublication(id) {
  const publication = (appData.publications || []).find(record => String(record.publication_id) === String(id));
  return publication && String(publication.status).toLowerCase() === 'remove_needed';
}
function handleItemTableClick(event) {
  const saleButton = event.target.closest('.sale-button');
  if (saleButton) { startSale(saleButton.dataset.itemId); return; }
  const reverseButton = event.target.closest('.reverse-sale-button');
  if (reverseButton) { reverseSaleFromHistory(reverseButton.dataset.saleId); return; }
  const withdrawButton = event.target.closest('.withdraw-publication');
  if (withdrawButton) { withdrawPublicationFromTable(withdrawButton.dataset.publicationId); return; }
  const button = event.target.closest('.edit-item-button');
  if (button) editItem(button.dataset.itemId);
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item').forEach(button => {
    button.addEventListener('click', () => {
      if (button.dataset.page === 'new-item') {
        startNewItem();
      } else {
        showPage(button.dataset.page);
      }
    });
  });

  // Acties vanuit dashboard, inventaris en verkoopgeschiedenis
  document.addEventListener('click', handleItemTableClick);
  document.getElementById('sell-item-button').addEventListener('click', () => {
    if (selectedItemId) startSale(selectedItemId);
  });

  document.getElementById('sale-form').addEventListener('submit', submitSale);
  document.getElementById('sale-channel-type').addEventListener('change', updateSaleChannelFields);
  document.getElementById('publication-form').addEventListener('submit', submitPublication);
  document.getElementById('report-from').addEventListener('change', renderVatReport);
  document.getElementById('report-to').addEventListener('change', renderVatReport);
  document.getElementById('publication-date').value = localToday();
  document.getElementById('report-from').value = new Date().getFullYear() + '-01-01';
  document.getElementById('report-to').value = localToday();
  document.getElementById('cancel-sale-button').addEventListener('click', cancelSale);

  loadData();

  document.getElementById('lookup_isbn_button')
    .addEventListener('click', lookupIsbn);

  document.getElementById('asking_price')
    .addEventListener('input', clearPriceError);
});
</script>
